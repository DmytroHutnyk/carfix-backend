spring:
  application:
    name: carfix-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1800000
      connection-timeout: 30000
      data-source-properties:
        ApplicationName: carfix-backend

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: ${DB_DEFAULT_SCHEMA}

  flyway:
    enabled: true
    schemas: ${DB_DEFAULT_SCHEMA}
    default-schema: ${DB_DEFAULT_SCHEMA}
    validate-on-migrate: true
    baseline-on-migrate: true
#    baseline-version: 0
#    locations: classpath:db/migration
#    table: flyway_schema_history

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_SMTP_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true #does not work for some reason
    java:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true #does not work
  health:
    mail:
      enabled: false

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: "${MAIL_FROM:CarFix <no-reply@carfix.local>}"
