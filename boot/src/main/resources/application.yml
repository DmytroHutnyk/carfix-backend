spring:
  application:
    name: carfix-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1800000
      connection-timeout: 30000
      data-source-properties:
        ApplicationName: carfix-backend

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: ${DB_DEFAULT_SCHEMA}

  flyway:
    enabled: true
    schemas: ${DB_DEFAULT_SCHEMA}
    default-schema: ${DB_DEFAULT_SCHEMA}
    validate-on-migrate: true
    baseline-on-migrate: true
#    baseline-version: 0
#    locations: classpath:db/migration
#    table: flyway_schema_history

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true #does not work for some reason
    java:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true #does not work